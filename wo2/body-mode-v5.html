<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROOM · Body Navigation V5</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0d;color:#e9efec;font-family:Arial,sans-serif}#stage{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;left:24px;top:22px;font:11px monospace;letter-spacing:.14em;color:#c6d2ce}.status{position:fixed;left:24px;bottom:24px;font:11px monospace;color:#a8b7b1;max-width:60vw}.intro{position:fixed;inset:0;display:grid;place-items:center;background:#07100fd9;backdrop-filter:blur(5px)}.intro.hide{display:none}.panel{width:min(460px,92vw);padding:34px;background:#101817;border:1px solid #b8c7bf33}.panel h1{font-weight:300;font-size:36px}.panel p{line-height:1.7;color:#9eaca7;font-size:13px}button{cursor:pointer;padding:13px 16px;margin:8px 0;width:100%;background:#d2dfd51b;color:#edf2ef;border:1px solid #a8c1b41f;font:12px monospace;letter-spacing:.1em}button:hover{background:#c6d9cf33}.hint{position:fixed;bottom:22px;right:24px;color:#9eaca7;font:10px monospace}.debug{position:fixed;right:20px;top:60px;background:#101817ee;border:1px solid #ffffff22;padding:15px;width:260px;display:none;font:12px monospace}.debug.show{display:block}.debug label{display:block;margin:12px 0}.debug input{width:100%}video{position:fixed;width:1px;height:1px;left:-20px}</style></head><body><div id="stage"></div><div class="hud">ROOM / BODY NAVIGATION <span id="mode">· IDLE</span></div><div class="status" id="status">Loading room model…</div><div class="hint">SCROLL / MOVE · LEFT CLICK · BODY MODE</div><video id="video" autoplay muted playsinline></video><section class="intro" id="intro"><div class="panel"><small>ROOM / EXPERIMENT 05</small><h1>Enter the space</h1><p>身体控制：摄像头识别上半身移动方向；手腕靠近空间区域触发互动。鼠标备用：滚轮推进/后退，按住左键转向。</p><button id="mouse">ENTER · MOUSE NAVIGATION</button><button id="body">ENTER · BODY NAVIGATION</button><p>摄像头仅在主动开启身体控制后请求。识别在浏览器本地运行。</p></div></section><div class="debug" id="debug"><strong>DEBUG / CALIBRATION</strong><button id="calibrate">CALIBRATE NEUTRAL</button><label>Move gain <input id="gain" type="range" min=".3" max="2" step=".05" value="1"></label><label>Zone radius <input id="radius" type="range" min=".15" max=".8" step=".05" value=".32"></label><label>Point size <input id="size" type="range" min=".003" max=".03" step=".001" value=".009"></label><button id="debugclose">CLOSE</button></div><button id="debugbtn" style="display:none;position:fixed;right:20px;bottom:20px;width:auto">DEBUG</button><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module" src="./src/body-mode-v5.js"></script></body></html>
