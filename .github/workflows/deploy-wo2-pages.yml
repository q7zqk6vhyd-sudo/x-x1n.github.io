name: Deploy wo2 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'wo2/**'
      - '.github/workflows/deploy-wo2-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload wo2 website
        uses: actions/upload-pages-artifact@v3
        with:
          path: wo2

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
