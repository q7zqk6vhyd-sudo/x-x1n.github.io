<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111415" />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="icon" href="./inmprojecticon.ico" type="image/x-icon" />
    <script type="importmap">
      {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
    </script>
    <title>INM Project</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Title"><span class="brand-mark">◌</span><span>Subtitle</span></a>
        <div class="topbar-meta"><span class="live-dot"></span>111</div>
      </header>
      <main class="layout">
        <section class="intro">
          <p class="eyebrow">ROOM SCAN · 01</p>
          <h1>Line 1 description<br /><span>description</span></h1>
          <form id="command-form" class="command-box">
            <label for="command-input">这个描述好尬，草</label>
            <div class="command-entry"><input id="command-input" type="text" placeholder="输入命令…" autocomplete="off" spellcheck="false" /><button type="submit">Command</button></div>
            <p class="command-help">/point X　调整点大小（不要大于0.1！！！！！）<br />/coor on　开启坐标读取<br />/coor off　关闭坐标读取</p>
            <p id="command-status" class="command-status" aria-live="polite">Model</p>
          </form>
        </section>
        <section class="viewer" aria-label="3D 房间点云查看器">
          <div class="viewer-top"><span><span class="live-dot"></span> ROOM / POINT CLOUD</span><button id="reset-view" type="button">重置视角 <span>↺</span></button></div>
          <div id="canvas-wrap"><div class="loading" id="loading"><span class="spinner"></span><span>正在载入空间…</span></div></div>
          <div class="viewer-bottom"><span>拖动旋转</span><span>滚轮缩放</span><span>右键平移</span></div>
          <div class="coord-readout" id="coord-readout" hidden></div>
          <div class="error" id="error" hidden></div>
        </section>
      </main>
      <footer><span>ROOM STUDY <span class="footer-dot">·</span> 2026</span><span>22222</span></footer>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
